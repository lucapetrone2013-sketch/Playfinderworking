            else{genre="Action-Adventure";setting=t.includes("spider-man")||t.includes("batman")||t.includes("last of us")?"Modern City":t.includes("star wars")||t.includes("horizon")||t.includes("control")?"Sci-Fi":t.includes("assassin's creed")||t.includes("ghost of tsushima")||t.includes("uncharted")||t.includes("tomb raider")?"Historical":"Fantasy";openWorld=t.includes("spider-man")||t.includes("assassin's creed")||t.includes("far cry")||t.includes("ghost of tsushima")||t.includes("horizon");storyImportance=t.includes("last of us")||t.includes("god of war")||t.includes("uncharted")?5:4;combatStyle=t.includes("far cry")||t.includes("uncharted")||t.includes("last of us")?"Shooting":"Melee";tags=[openWorld?"Open World":"Cinematic","Action"];}

            const year = 2014 + ((index * 7 + title.length) % 12);
            const shortDescription = `${title} delivers a standout ${genre.toLowerCase()} experience set in a ${setting.toLowerCase()} world.`;
            return { id:`game-${index+1}`, rank:index+1, title, year, genre, setting, mode, difficulty, openWorld, storyImportance, explorationLevel, progressionLevel, graphicsLevel, estimatedHours, lengthCategory, combatStyle, tags, shortDescription, palette:GENRE_PALETTES[genre]||GENRE_PALETTES["Action-Adventure"] };
        }
        const GAMES_DB = UNIQUE_TITLES.map((t,i)=>classifyGame(t,i));

        // EXPANDED QUIZ QUESTIONS (12 Total)
        const QUIZ_QUESTIONS = [
            { id:"mood", title:"What are you in the mood for?", subtitle:"Pick the core feeling for this session.", type:"single", options:[{value:"explore",label:"Exploring a huge world",desc:"Vast landscapes & secrets"},{value:"story",label:"An amazing story",desc:"Characters & emotional depth"},{value:"action",label:"Fast-paced action",desc:"Adrenaline & intense combat"},{value:"friends",label:"Playing with friends",desc:"Co-op or party chaos"},{value:"relaxing",label:"Something relaxing",desc:"Low-stress & cozy vibes"},{value:"challenge",label:"A difficult challenge",desc:"Boss fights & mastery"}] },
            { id:"world", title:"What type of world?", subtitle:"Choose the atmosphere.", type:"single", options:[{value:"Modern City",label:"Modern city",desc:"Urban streets & crime"},{value:"Fantasy",label:"Fantasy",desc:"Magic & ancient realms"},{value:"Sci-Fi",label:"Sci-Fi",desc:"Space & futuristic tech"},{value:"Historical",label:"Historical",desc:"Samurai & empires"},{value:"Horror",label:"Horror",desc:"Eerie tension & dread"},{value:"any",label:"Doesn't matter",desc:"Surprise me"}] },
            { id:"story", title:"How important is the story?", subtitle:"Narrative weight preference.", type:"slider", options:[{value:1,label:"Not important",desc:"Pure gameplay loops"},{value:2,label:"Nice to have",desc:"Light worldbuilding"},{value:4,label:"Very important",desc:"Strong characters & plot"},{value:5,label:"Essential",desc:"Top priority"}] },
            { id:"multiplayer", title:"Multiplayer preference?", subtitle:"Solo or teaming up?", type:"single", options:[{value:"solo",label:"Single-player only",desc:"Dedicated solo adventure"},{value:"mostly-solo",label:"Mostly single-player",desc:"Optional online features"},{value:"either",label:"Either is fine",desc:"Depends on the game"},{value:"multi",label:"I want multiplayer",desc:"Co-op or competitive"}] },
            { id:"time", title:"How much time do you have?", subtitle:"Match scope to schedule.", type:"single", options:[{value:"A few hours",label:"A few hours",desc:"Quick punchy sessions"},{value:"A weekend",label:"A weekend",desc:"10-25 hour adventures"},{value:"A few weeks",label:"A few weeks",desc:"30-60 hour journeys"},{value:"Give me something huge",label:"Something huge",desc:"80+ hour epics"}] },
            { id:"combat", title:"Preferred combat style?", subtitle:"What feels satisfying?", type:"single", options:[{value:"Shooting",label:"Shooting",desc:"Gunplay & tactics"},{value:"Melee",label:"Melee",desc:"Swords & combos"},{value:"Stealth",label:"Stealth",desc:"Sneaking & gadgets"},{value:"Strategy",label:"Strategy",desc:"Turn-based planning"},{value:"Racing/sports",label:"Racing/Sports",desc:"Speed & athletics"},{value:"Doesn't matter",label:"Doesn't matter",desc:"Open to anything"}] },
            { id:"difficulty", title:"Difficulty level?", subtitle:"Level of resistance.", type:"single", options:[{value:"Relaxed",label:"Relaxed",desc:"Forgiving & smooth"},{value:"Normal",label:"Normal",desc:"Balanced engagement"},{value:"Challenging",label:"Challenging",desc:"Requires focus & builds"},{value:"Extremely Difficult",label:"Extremely difficult",desc:"Punishing & earned wins"}] },
            { id:"visuals", title:"Visual style preference?", subtitle:"Art direction matters.", type:"single", options:[{value:"realistic",label:"Photorealistic",desc:"Cutting-edge fidelity"},{value:"stylized",label:"Stylized / Artistic",desc:"Unique aesthetic vision"},{value:"retro",label:"Retro / Pixel",desc:"Nostalgic charm"},{value:"any",label:"No preference",desc:"Gameplay over graphics"}] },
            { id:"pacing", title:"Preferred pacing?", subtitle:"How should it flow?", type:"single", options:[{value:"slow",label:"Slow burn",desc:"Methodical & atmospheric"},{value:"balanced",label:"Balanced",desc:"Mix of calm & intense"},{value:"fast",label:"Non-stop",desc:"Constant momentum"},{value:"burst",label:"Short bursts",desc:"Pick up & play anytime"}] },
            { id:"replay", title:"Replayability value?", subtitle:"One-and-done vs endless.", type:"single", options:[{value:"once",label:"One great run",desc:"Linear curated experience"},{value:"some",label:"Some variety",desc:"Multiple endings/builds"},{value:"endless",label:"Endless replayability",desc:"Procedural or competitive"}] },
            { id:"priorities", title:"Top priorities?", subtitle:"Select up to two pillars.", type:"multi", maxSelect:2, options:[{value:"graphics",label:"Graphics",desc:"Visual presentation"},{value:"story",label:"Story",desc:"Writing & lore"},{value:"freedom",label:"Freedom",desc:"Open-ended choices"},{value:"progression",label:"Progression",desc:"Upgrades & loot"},{value:"exploration",label:"Exploration",desc:"Hidden paths & secrets"},{value:"friends",label:"Friends",desc:"Shared experiences"}] },
            { id:"style", title:"Structure preference?", subtitle:"Final vibe check.", type:"single", options:[{value:"open",label:"Open & self-directed",desc:"Go anywhere, any order"},{value:"guided",label:"Focused & handcrafted",desc:"Curated chapters"},{value:"session",label:"Runs or matches",desc:"Roguelike or PvP loops"},{value:"any",label:"No preference",desc:"Best overall match"}] }
        ];

        function computeRecommendations(answers) {
            const scored = GAMES_DB.map((game) => {
                let score = 45; const reasons = [];
                if(answers.mood==="explore"){if(game.openWorld){score+=18;reasons.push("expansive open world")}else if(game.explorationLevel>=4){score+=12;reasons.push("rich exploration")}}
                else if(answers.mood==="story"){if(game.storyImportance>=5){score+=20;reasons.push("unforgettable narrative")}else if(game.storyImportance===4){score+=13}else{score-=10}}
                else if(answers.mood==="action"){if(game.genre==="Shooter"||game.genre==="Action-Adventure"){score+=17;reasons.push("high-momentum action")}}
                else if(answers.mood==="friends"){if(game.mode==="Co-op"||game.mode==="Multiplayer"||game.mode==="Single & Multiplayer"){score+=22;reasons.push(`${game.mode} design`)}else{score-=22}}
                else if(answers.mood==="relaxing"){if(game.difficulty==="Relaxed"){score+=22;reasons.push("low-stress pace")}else if(game.difficulty==="Extremely Difficult"){score-=24}}
                else if(answers.mood==="challenge"){if(game.difficulty==="Extremely Difficult"){score+=22;reasons.push("demanding challenge")}else if(game.difficulty==="Challenging"){score+=15}}
                
                if(answers.world&&answers.world!=="any"){if(game.setting===answers.world){score+=16;reasons.push(`${game.setting} setting`)}else{score-=6}}
                const targetStory=Number(answers.story||3);
                if(targetStory>=4){if(game.storyImportance>=4){score+=12;if(!reasons.some(r=>r.includes("story")))reasons.push("deep narrative")}}
                
                if(answers.multiplayer==="solo"){if(game.mode==="Single-player")score+=14;else if(game.mode==="Single & Multiplayer")score+=6;else score-=24}
                else if(answers.multiplayer==="multi"){if(game.mode==="Multiplayer"||game.mode==="Co-op"){score+=22;reasons.push("multiplayer focus")}else if(game.mode==="Single & Multiplayer")score+=12;else score-=25}
                
                if(answers.time){if(game.lengthCategory===answers.time){score+=11;reasons.push(`fits "${answers.time}" schedule`)}else if(answers.time==="A few hours"&&game.lengthCategory==="Give me something huge")score-=12}
                if(answers.combat&&answers.combat!=="Doesn't matter"){if(game.combatStyle===answers.combat){score+=15;reasons.push(`${answers.combat} mechanics`)}else score-=5}
                if(answers.difficulty){if(game.difficulty===answers.difficulty)score+=12;else if((answers.difficulty==="Relaxed"&&game.difficulty==="Extremely Difficult")||(answers.difficulty==="Extremely Difficult"&&game.difficulty==="Relaxed"))score-=18}
                
                // NEW SCORING LOGIC
                if(answers.visuals==="realistic"&&game.graphicsLevel>=5){score+=8;reasons.push("stunning visuals")}
                if(answers.visuals==="retro"&&(game.genre==="Roguelike & Indie"||game.tags.includes("Pixel"))){score+=10;reasons.push("retro aesthetic")}
                if(answers.pacing==="fast"&&(game.genre==="Shooter"||game.tags.includes("Fast-Paced"))){score+=10;reasons.push("non-stop pacing")}
                if(answers.pacing==="slow"&&(game.genre==="Strategy & Sim"||game.difficulty==="Relaxed")){score+=8;reasons.push("methodical pacing")}
                if(answers.replay==="endless"&&(game.mode!=="Single-player"||game.genre==="Roguelike & Indie"||game.genre==="Strategy & Sim")){score+=12;reasons.push("endless replayability")}
                if(answers.replay==="once"&&game.storyImportance>=4&&game.mode==="Single-player"){score+=10;reasons.push("curated linear experience")}

                const priorities=answers.priorities||[];
                priorities.forEach(p=>{if(p==="graphics"&&game.graphicsLevel>=5)score+=9;if(p==="story"&&game.storyImportance>=4)score+=9;if(p==="freedom"&&game.openWorld){score+=10;reasons.push("player freedom")}if(p==="progression"&&game.progressionLevel>=4)score+=9;if(p==="exploration"&&game.explorationLevel>=4)score+=9;if(p==="friends"&&game.mode!=="Single-player")score+=12});
                
                if(answers.style==="open"&&game.openWorld)score+=8;
                if(answers.style==="guided"&&!game.openWorld&&game.storyImportance>=4)score+=8;
                if(answers.style==="session"&&(game.genre==="Roguelike & Indie"||game.mode==="Multiplayer"))score+=8;

                score += Math.max(0, 6 - Math.floor(game.rank / 65));
                const clampedPercent = Math.max(64, Math.min(99, Math.round(score)));
                const uniqueReasons = Array.from(new Set(reasons)).slice(0,3);
                const whyMatches = uniqueReasons.length>0 ? `Matches your picks with ${uniqueReasons.join(", ")}.` : `Well-rounded ${game.genre} pick aligned with your preferences.`;
                return {...game, rawScore:score, matchPercent:clampedPercent, whyMatches};
            });
            scored.sort((a,b)=>b.rawScore-a.rawScore||a.rank-b.rank);
            if(scored.length>0){const topRaw=scored[0].rawScore;scored.slice(0,7).forEach((item,idx)=>{const gap=Math.max(0,topRaw-item.rawScore);item.matchPercent=Math.max(76,Math.min(98,97-idx*2-Math.floor(gap/4)))})}
            return scored;
        }

        // APP CONTROLLER
        const app = {
            state: {
                page:'home', prevPage:'home', quizStep:0, 
                quizAnswers:{mood:null,world:null,story:4,multiplayer:null,time:null,combat:null,difficulty:null,visuals:null,pacing:null,replay:null,priorities:[],style:null},

                favorites:JSON.parse(localStorage.getItem('pf_fav')||'[]'),
                recentIds:JSON.parse(localStorage.getItem('pf_rec')||'[]'),
                lastSavedQuiz:JSON.parse(localStorage.getItem('pf_quiz')||'null'),
                searchQuery:'', filters:{genre:'All',mode:'All',difficulty:'All',setting:'All',openWorld:false,story:false,exploration:false,quick:false},
                sortBy:'featured', visibleCount:24, showAdvanced:false, mobileMenuOpen:false, libraryTab:'favorites',

            },
            init(){this.renderNav();this.navigate('home');lucide.createIcons()},
            save(){localStorage.setItem('pf_fav',JSON.stringify(this.state.favorites));localStorage.setItem('pf_rec',JSON.stringify(this.state.recentIds));if(this.state.lastSavedQuiz)localStorage.setItem('pf_quiz',JSON.stringify(this.state.lastSavedQuiz))},
            toggleFavorite(id){const e=this.state.favorites.includes(id);this.state.favorites=e?this.state.favorites.filter(f=>f!==id):[id,...this.state.favorites];const g=GAMES_DB.find(x=>x.id===id);this.showToast(e?`Removed ${g?.title}`:`Saved ${g?.title}`);this.save();this.renderCurrentPage();this.renderNav()},
            showToast(msg){const c=document.getElementById('toast-container');const el=document.createElement('div');el.className='pointer-events-auto glass-panel px-5 py-3 rounded-xl text-white text-sm font-medium shadow-2xl flex items-center gap-3 animate-slide-up border-l-4 border-l-accent';el.innerHTML=`<i data-lucide="check-circle-2" class="w-5 h-5 text-accent-glow shrink-0"></i><span>${msg}</span>`;c.appendChild(el);lucide.createIcons({nodes:[el]});setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300)},3000)},
            toggleMobileMenu(){this.state.mobileMenuOpen=!this.state.mobileMenuOpen;const d=document.getElementById('mobile-drawer');const b=document.getElementById('mobile-menu-btn');if(this.state.mobileMenuOpen){d.classList.remove('hidden');b.innerHTML='<i data-lucide="x" class="w-6 h-6"></i>'}else{d.classList.add('hidden');b.innerHTML='<i data-lucide="menu" class="w-6 h-6"></i>'}lucide.createIcons()},
            navigate(page,focusSearch=false){this.state.prevPage=this.state.page;this.state.page=page;this.state.mobileMenuOpen=false;document.getElementById('mobile-drawer').classList.add('hidden');document.getElementById('mobile-menu-btn').innerHTML='<i data-lucide="menu" class="w-6 h-6"></i>';window.scrollTo({top:0,behavior:'smooth'});this.renderNav();this.renderCurrentPage();if(focusSearch)setTimeout(()=>document.getElementById('explore-search')?.focus(),100);lucide.createIcons()},
            renderNav(){
                const pages=[{id:'home',label:'Discover'},{id:'quiz',label:'Quiz',action:()=>this.startQuiz()},{id:'explore',label:'Explore'},{id:'favorites',label:'Library'}];
                document.getElementById('desktop-nav').innerHTML=pages.map(p=>{const a=this.state.page===p.id||(p.id==='quiz'&&this.state.page==='results');return `<button onclick="${p.action?'app.startQuiz()':`app.navigate('${p.id}')`}" class="px-4 py-1.5 rounded-full text-sm font-medium transition-all cursor-pointer ${a?'bg-white/10 text-white shadow-inner':'text-zinc-400 hover:text-white hover:bg-white/5'}">${p.label}</button>`}).join('');
                const m=document.getElementById('mobile-nav-links');
                m.innerHTML=pages.map(p=>{const a=this.state.page===p.id;return `<button onclick="${p.action?'app.startQuiz()':`app.navigate('${p.id}')`}" class="w-full text-left px-4 py-3 rounded-xl text-base font-medium transition-colors cursor-pointer ${a?'bg-accent/10 text-accent-glow border border-accent/20':'text-zinc-400 hover:bg-white/5'}">${p.label}</button>`}).join('')+
                `<button onclick="app.navigate('about')" class="w-full text-left px-4 py-3 rounded-xl text-base font-medium text-zinc-400 hover:bg-white/5 cursor-pointer">About</button>`+
                `<button onclick="app.navigate('contact')" class="w-full text-left px-4 py-3 rounded-xl text-base font-medium text-zinc-400 hover:bg-white/5 cursor-pointer">Contact</button>`+
                `<button onclick="app.navigate('privacy')" class="w-full text-left px-4 py-3 rounded-xl text-base font-medium text-zinc-400 hover:bg-white/5 cursor-pointer">Privacy</button>`;
                lucide.createIcons();
            },
            startQuiz(preset=null){this.state.quizAnswers={mood:preset,world:null,story:4,multiplayer:null,time:null,combat:null,difficulty:null,visuals:null,pacing:null,replay:null,priorities:[],style:null};this.state.quizStep=preset?1:0;this.state.quizResults=[];this.navigate('quiz')},
            handleQuizOption(qId,val){const q=QUIZ_QUESTIONS.find(x=>x.id===qId);if(q.type==='multi'){let c=this.state.quizAnswers[qId]||[];if(c.includes(val))c=c.filter(v=>v!==val);else if(c.length>=q.maxSelect)c=[c[1],val];else c=[...c,val];this.state.quizAnswers[qId]=c;this.renderCurrentPage()}else{this.state.quizAnswers[qId]=val;if(q.type==='single'){if(this.state.quizStep<QUIZ_QUESTIONS.length-1){this.state.quizStep++;this.renderCurrentPage()}else this.finishQuiz()}else this.renderCurrentPage()}},
            finishQuiz(){const r=computeRecommendations(this.state.quizAnswers).slice(0,7);this.state.quizResults=r;this.state.lastSavedQuiz={timestamp:Date.now(),answers:this.state.quizAnswers,topIds:r.map(g=>({id:g.id,matchPercent:g.matchPercent,whyMatches:g.whyMatches}))};this.save();this.navigate('results')},
            openGameDetails(game){this.state.selectedGame=game;this.state.recentIds=[game.id,...this.state.recentIds.filter(i=>i!==game.id)].slice(0,12);this.save();this.navigate('details')},
            getFilteredGames(){const{searchQuery:f,sortBy:s}=this.state;const q=f.trim().toLowerCase();let l=GAMES_DB.filter(g=>{if(this.state.filters.genre!=='All'&&g.genre!==this.state.filters.genre)return false;if(this.state.filters.mode!=='All'){if(this.state.filters.mode==='Single-player'&&g.mode!=='Single-player'&&g.mode!=='Single & Multiplayer')return false;if(this.state.filters.mode==='Multiplayer'&&g.mode!=='Multiplayer'&&g.mode!=='Single & Multiplayer')return false;if(this.state.filters.mode==='Co-op'&&g.mode!=='Co-op'&&g.mode!=='Single & Multiplayer')return false}if(this.state.filters.difficulty!=='All'){if(this.state.filters.difficulty==='Difficult'&&g.difficulty!=='Challenging'&&g.difficulty!=='Extremely Difficult')return false;else if(this.state.filters.difficulty!=='Difficult'&&g.difficulty!==this.state.filters.difficulty)return false}if(this.state.filters.setting!=='All'&&g.setting!==this.state.filters.setting)return false;if(this.state.filters.openWorld&&!g.openWorld)return false;if(this.state.filters.story&&g.storyImportance<4)return false;if(this.state.filters.exploration&&g.explorationLevel<4)return false;if(this.state.filters.quick&&g.lengthCategory!=='A few hours'&&g.lengthCategory!=='A weekend')return false;if(q){const h=`${g.title} ${g.genre} ${g.setting} ${g.tags.join(' ')} ${g.shortDescription}`.toLowerCase();if(!h.includes(q))return false}return true});if(s==='newest')l.sort((a,b)=>b.year-a.year||a.rank-b.rank);else if(s==='az')l.sort((a,b)=>a.title.localeCompare(b.title));else if(s==='difficulty'){const d={Relaxed:1,Normal:2,Challenging:3,"Extremely Difficult":4};l.sort((a,b)=>d[b.difficulty]-d[a.difficulty])}else l.sort((a,b)=>a.rank-b.rank);return l},

            // VISUAL COMPONENTS
            genArtwork(game,large=false,cls="h-48"){let h=0;for(let i=0;i<game.title.length;i++){h=(h<<5)-h+game.title.charCodeAt(i);h|=0}h=Math.abs(h);const cx=25+(h%55),cy=25+((h>>4)%50),sz=large?"w-12 h-12":"w-6 h-6";return `<div class="relative overflow-hidden select-none bg-bg-card ${cls} w-full" style="background-image:radial-gradient(circle at ${cx}% ${cy}%,${game.palette.from}40 0%,transparent 70%)"><div class="absolute inset-0 bg-gradient-to-b from-transparent via-bg-card/20 to-bg-card"></div><svg class="absolute inset-0 w-full h-full opacity-[0.04]" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice"><line x1="0" y1="73" x2="400" y2="73" stroke="#fff" stroke-width="1"/><line x1="0" y1="146" x2="400" y2="146" stroke="#fff" stroke-width="1"/><line x1="133" y1="0" x2="133" y2="220" stroke="#fff" stroke-width="1"/><line x1="266" y1="0" x2="266" y2="220" stroke="#fff" stroke-width="1"/></svg><div class="relative h-full flex flex-col justify-between p-5"><div class="flex items-start justify-between"><span class="px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider bg-black/40 backdrop-blur-md text-white border border-white/10">${game.genre}</span></div><div class="flex items-end justify-between"><div class="p-3 rounded-xl bg-white/5 backdrop-blur-md border border-white/10 text-white shadow-lg"><i data-lucide="${game.palette.emblem}" class="${sz}"></i></div><span class="text-xs font-mono font-medium text-white/60 bg-black/40 px-2 py-1 rounded backdrop-blur-sm">${game.year}</span></div></div></div>`},
            genGameCard(game,match=null,why=null){const fav=this.state.favorites.includes(game.id);return `<article class="group relative flex flex-col rounded-2xl bg-bg-card border border-white/[0.06] hover:border-accent/30 overflow-hidden transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-accent/10 h-full"><div class="relative card-img-container cursor-pointer aspect-[16/10]" onclick="app.openGameDetails(GAMES_DB.find(g=>g.id==='${game.id}'))">${this.genArtwork(game,false,"h-full w-full")}${match?`<div class="absolute top-3 left-3 px-2.5 py-1 rounded-lg bg-accent/90 backdrop-blur-md text-white font-bold text-xs shadow-lg border border-white/20">${match}% MATCH</div>`:''}<div class="absolute inset-0 bg-gradient-to-t from-bg-card via-transparent to-transparent opacity-80"></div></div><button onclick="event.stopPropagation();app.toggleFavorite('${game.id}')" class="absolute top-3 right-3 z-20 p-2 rounded-full transition-all cursor-pointer ${fav?'bg-white text-accent shadow-lg':'bg-black/40 backdrop-blur-md text-white/70 hover:text-white hover:bg-black/60'}"><i data-lucide="heart" class="w-4 h-4 ${fav?'fill-current':''}"></i></button><div class="flex-1 p-5 flex flex-col justify-between gap-4"><div class="space-y-2 cursor-pointer" onclick="app.openGameDetails(GAMES_DB.find(g=>g.id==='${game.id}'))"><div class="flex items-center gap-2 text-[11px] font-medium text-zinc-500 uppercase tracking-wide"><span>${game.mode.split('&')[0].trim()}</span><span class="w-1 h-1 rounded-full bg-zinc-700"></span><span>${game.difficulty}</span></div><h3 class="text-lg font-bold text-white leading-tight group-hover:text-accent-glow transition-colors line-clamp-1">${game.title}</h3><p class="text-sm text-zinc-400 leading-relaxed line-clamp-2">${game.shortDescription}</p>${why?`<p class="mt-2 text-xs text-zinc-300 bg-accent/5 border border-accent/10 rounded-lg p-2.5 leading-relaxed"><span class="text-accent-glow font-semibold">Why:</span> ${why.replace('Matches your picks with ','').replace('.','')}</p>`:''}</div><div class="pt-4 border-t border-white/[0.06] flex items-center justify-between gap-2"><div class="flex items-center gap-1.5 overflow-hidden max-h-5">${game.tags.slice(0,2).map(t=>`<span class="text-[10px] font-medium text-zinc-500 bg-white/[0.03] px-1.5 py-0.5 rounded">#${t.replace(/\s+/g,'')}</span>`).join('')}</div><button onclick="app.openGameDetails(GAMES_DB.find(g=>g.id==='${game.id}'))" class="shrink-0 text-xs font-bold text-zinc-400 group-hover:text-white inline-flex items-center gap-1 transition-colors cursor-pointer uppercase tracking-wide">Details <i data-lucide="arrow-right" class="w-3.5 h-3.5 group-hover:translate-x-0.5 transition-transform"></i></button></div></div></article>`},
            
            renderCurrentPage(){const r=document.getElementById('app-root');r.className='flex-1 animate-fade-in w-full';switch(this.state.page){case 'home':r.innerHTML=this.renderHome();break;case 'quiz':r.innerHTML=this.renderQuiz();break;case 'results':r.innerHTML=this.renderResults();break;case 'explore':r.innerHTML=this.renderExplore();break;case 'details':r.innerHTML=this.renderDetails();break;case 'favorites':r.innerHTML=this.renderLibrary();break;case 'about':r.innerHTML=this.renderAbout();break;case 'contact':r.innerHTML=this.renderContact();break;case 'privacy':r.innerHTML=this.renderPrivacy();break;}lucide.createIcons()},

                const g=this.state.selectedGame;if(!g)return '';const fav=this.state.favorites.includes(g.id);
                const sim=GAMES_DB.filter(c=>c.id!==g.id).map(c=>{let s=0;if(c.genre===g.genre)s+=5;if(c.setting===g.setting)s+=3;if(c.mode===g.mode)s+=2;if(c.combatStyle===g.combatStyle)s+=2;if(c.openWorld===g.openWorld)s+=1;return{g:c,s}}).sort((a,b)=>b.s-a.s||a.g.rank-b.g.rank).slice(0,4).map(x=>x.g);
                const hl=[];if(g.storyImportance>=4)hl.push({t:"Rich Storytelling",d:"Memorable characters, narrative depth, and a gripping plot."});if(g.openWorld||g.explorationLevel>=4)hl.push({t:"Rewarding Exploration",d:"Packed with secrets, landmarks, and freedom to chart your path."});if(g.progressionLevel>=4)hl.push({t:"Deep Progression",d:"Satisfying builds, gear upgrades, and mastery loops."});if(g.graphicsLevel>=4)hl.push({t:"Standout Visuals",d:"Atmospheric environments and striking art direction."});if(g.mode==="Co-op"||g.mode==="Multiplayer")hl.push({t:`Built for ${g.mode}`,d:"Shines brightest when teaming up or competing."});if(!hl.length)hl.push({t:`Focused ${g.genre} Craft`,d:`Tight, well-paced ${g.difficulty.toLowerCase()} experience.`});
                return `<section class="max-w-6xl mx-auto py-8 sm:py-14 space-y-12"><div class="flex items-center justify-between gap-3"><button onclick="app.navigate(app.state.prevPage==='details'?'explore':app.state.prevPage)" class="inline-flex items-center gap-2 text-sm font-bold text-zinc-400 hover:text-white transition-colors cursor-pointer px-4 py-2 rounded-xl hover:bg-white/[0.05]"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back</button><button onclick="app.startQuiz()" class="text-sm font-bold text-zinc-400 hover:text-accent-glow transition-colors cursor-pointer">Find Another Game →</button></div><div class="rounded-3xl bg-gradient-to-br from-bg-card to-bg-elevated border border-white/[0.08] overflow-hidden grid grid-cols-1 lg:grid-cols-12 shadow-2xl shadow-black/50"><div class="lg:col-span-5 relative card-img-container">${this.genArtwork(g,true,"h-72 sm:h-80 lg:h-full min-h-[350px]")}</div><div class="lg:col-span-7 p-8 sm:p-10 lg:p-12 space-y-8"><div class="flex flex-wrap items-start justify-between gap-4"><div class="space-y-2"><div class="flex items-center gap-2 text-sm text-zinc-400 font-medium"><span class="text-white bg-white/[0.06] px-2 py-0.5 rounded">${g.genre}</span><span>·</span><span>${g.year}</span>${g.openWorld?'<span>·</span><span>Open World</span>':''}</div><h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight leading-tight">${g.title}</h1></div><button onclick="app.toggleFavorite('${g.id}')" class="px-4 py-2.5 rounded-xl border text-sm font-bold inline-flex items-center gap-2 transition-all cursor-pointer ${fav?'bg-white text-bg border-white':'bg-transparent hover:bg-white/[0.05] border-white/[0.1] text-white'}"><i data-lucide="heart" class="w-4 h-4 ${fav?'fill-bg text-bg':''}"></i> ${fav?'Saved':'Save'}</button></div><p class="text-zinc-300 text-lg leading-relaxed">${g.shortDescription}</p><div class="grid grid-cols-2 sm:grid-cols-4 gap-4 pt-2">${[['Mode',g.mode],['Difficulty',g.difficulty],['Setting',g.setting],['Playtime',g.estimatedHours]].map(([l,v])=>`<div class="p-4 rounded-2xl bg-white/[0.02] border border-white/[0.04]"><div class="text-[10px] font-bold uppercase tracking-wider text-zinc-500 mb-1">${l}</div><div class="text-sm font-bold text-white">${v}</div></div>`).join('')}</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-5 pt-2">${[['Story',g.storyImportance],['Exploration',g.explorationLevel],['Progression',g.progressionLevel],['Visuals',g.graphicsLevel]].map(([l,v])=>`<div class="space-y-2"><div class="flex items-center justify-between text-xs font-bold uppercase tracking-wider"><span class="text-zinc-500">${l}</span><span class="text-zinc-300">${v}/5</span></div><div class="grid grid-cols-5 gap-1.5">${[1,2,3,4,5].map(s=>`<div class="h-2 rounded-full ${s<=v?'bg-accent shadow-[0_0_8px_rgba(124,58,237,0.4)]':'bg-white/[0.06]'}"></div>`).join('')}</div></div>`).join('')}</div><div class="p-6 rounded-2xl bg-accent/5 border border-accent/10 space-y-3"><div class="text-xs font-bold uppercase tracking-wider text-accent-glow">Why you might like this</div>${hl.map(h=>`<p class="text-sm text-zinc-300 leading-relaxed"><strong class="text-white font-bold">${h.t}:</strong> ${h.d}</p>`).join('')}</div><div class="flex flex-wrap gap-2 pt-2">${g.tags.map(t=>`<span class="text-xs font-medium text-zinc-500 bg-white/[0.03] px-2 py-1 rounded border border-white/[0.03]">#${t.replace(/\s+/g,'')}</span>`).join('')}</div></div></div><div><h2 class="text-2xl font-bold text-white mb-6 tracking-tight">Similar Games</h2><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">${sim.map(s=>this.genGameCard(s)).join('')}</div></div></section>`},
            
            renderLibrary(){
                const fav=this.state.favorites.map(id=>GAMES_DB.find(g=>g.id===id)).filter(Boolean);
                const rec=this.state.recentIds.map(id=>GAMES_DB.find(g=>g.id===id)).filter(Boolean);
                let r=[];if(this.state.quizResults.length>0)r=this.state.quizResults;else if(this.state.lastSavedQuiz?.topIds)r=this.state.lastSavedQuiz.topIds.map(e=>{const g=GAMES_DB.find(x=>x.id===e.id);return g?{...g,matchPercent:e.matchPercent,whyMatches:e.whyMatches}:null}).filter(Boolean);else if(fav.length>0||rec.length>0){const s=fav[0]||rec[0];r=GAMES_DB.filter(g=>!this.state.favorites.includes(g.id)).map(g=>({...g,matchPercent:g.genre===s.genre&&g.setting===s.setting?94:g.genre===s.genre?88:79,whyMatches:`Recommended because you saved or viewed ${s.title}.`})).sort((a,b)=>b.matchPercent-a.matchPercent).slice(0,6)}
                const tabs=[{id:'favorites',l:'Favorites',c:fav.length},{id:'recent',l:'Recently Viewed',c:rec.length},{id:'recommended',l:'For You',c:r.length}];
                const empty=(t,st)=>`<div class="p-20 rounded-3xl bg-bg-card border border-white/[0.06] text-center space-y-6 max-w-xl mx-auto"><div class="w-16 h-16 rounded-2xl bg-white/[0.03] mx-auto flex items-center justify-center text-zinc-600"><i data-lucide="gamepad-2" class="w-8 h-8"></i></div><h2 class="text-2xl font-bold text-white">${t}</h2><p class="text-zinc-400">${st}</p><div class="flex flex-wrap items-center justify-center gap-3 pt-2"><button onclick="app.startQuiz()" class="btn-glow px-6 py-3 rounded-xl bg-accent hover:bg-accent-glow text-white font-bold text-sm cursor-pointer shadow-lg shadow-accent/20">Find My Game</button><button onclick="app.navigate('explore')" class="px-6 py-3 rounded-xl bg-white/[0.03] hover:bg-white/[0.08] border border-white/[0.08] text-zinc-200 font-bold text-sm cursor-pointer">Explore Games</button></div></div>`;
                let content='';if(this.state.libraryTab==='favorites')content=fav.length>0?`<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">${fav.map(g=>this.genGameCard(g)).join('')}</div>`:empty("Your library is empty.","Explore games or take the quiz to start building your collection.");else if(this.state.libraryTab==='recent')content=rec.length>0?`<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">${rec.map(g=>this.genGameCard(g)).join('')}</div>`:empty("No recently viewed games.","Inspect any game card to save it to your history.");else content=r.length>0?`<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">${r.map(g=>this.genGameCard(g,g.matchPercent,g.whyMatches)).join('')}</div>`:empty("Your personal picks are one quiz away.","Take the 12-question quiz to unlock tailored recommendations.");
                return `<section class="max-w-7xl mx-auto py-10 sm:py-16 space-y-10"><div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4"><div><h1 class="text-4xl font-extrabold text-white tracking-tight">My Library</h1><p class="text-zinc-400 mt-2">Saved favorites, history, and personal matches.</p></div>${this.state.libraryTab==='favorites'&&fav.length>0?`<button onclick="app.state.favorites=[];app.save();app.renderCurrentPage();app.renderNav();app.showToast('Cleared saved favorites')" class="self-start sm:self-auto text-sm font-bold text-red-400/80 hover:text-red-400 transition-colors cursor-pointer px-4 py-2 rounded-xl hover:bg-red-400/10">Clear Favorites</button>`:''}</div><div class="flex items-center gap-2 p-1 bg-bg-card rounded-2xl border border-white/[0.06] w-fit">${tabs.map(t=>`<button onclick="app.state.libraryTab='${t.id}';app.renderCurrentPage()" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all flex items-center gap-2 cursor-pointer ${this.state.libraryTab===t.id?'bg-white/10 text-white shadow-sm':'text-zinc-500 hover:text-zinc-300'}"><span>${t.l}</span><span class="text-[10px] font-mono bg-white/[0.06] px-1.5 py-0.5 rounded text-zinc-400">${t.c}</span></button>`).join('')}</div>${content}</section>`},
            
            renderAbout(){return `<section class="max-w-3xl mx-auto py-14 sm:py-20 space-y-12"><div class="space-y-6"><p class="text-xs font-bold uppercase tracking-[0.2em] text-accent-glow">About PlayFinder</p><h1 class="text-4xl sm:text-6xl font-extrabold text-white tracking-tight leading-tight">Game discovery without bloat or guesswork.</h1><p class="text-lg text-zinc-400 leading-relaxed">PlayFinder was designed to solve choice overload. Answer twelve focused questions about your current mood, preferred world, schedule, visual style, and playstyle—and our weighted scoring engine surfaces games that genuinely fit.</p></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-6 py-8 border-y border-white/[0.06]"><div><div class="text-3xl font-extrabold text-white mb-1">${GAMES_DB.length}</div><div class="text-sm font-bold text-zinc-300">Curated Titles</div><p class="text-xs text-zinc-500 mt-2 leading-relaxed">Across blockbusters, indies, co-op hits, horror, racers, and strategy.</p></div><div><div class="text-3xl font-extrabold text-white mb-1">12 Factors</div><div class="text-sm font-bold text-zinc-300">Weighted Scoring</div><p class="text-xs text-zinc-500 mt-2 leading-relaxed">Evaluates mood, setting, story, multiplayer, playtime, combat, difficulty, visuals, pacing, and replayability.</p></div><div><div class="text-3xl font-extrabold text-white mb-1">100% Local</div><div class="text-sm font-bold text-zinc-300">Zero Accounts</div><p class="text-xs text-zinc-500 mt-2 leading-relaxed">No signups or external servers. Your library stays right on your device.</p></div></div><div><button onclick="app.startQuiz()" class="btn-glow px-8 py-4 rounded-2xl bg-accent hover:bg-accent-glow text-white font-bold text-lg cursor-pointer shadow-xl shadow-accent/20">Find My Game →</button></div></section>`},
            
            renderContact(){
                return `<section class="max-w-2xl mx-auto py-14 sm:py-20 space-y-10">
                    <div class="text-center space-y-4"><h1 class="text-4xl font-extrabold text-white tracking-tight">Get in Touch</h1><p class="text-zinc-400">Have a game suggestion, found a bug, or just want to say hi? We'd love to hear from you.</p></div>
                    <form onsubmit="event.preventDefault();app.showToast('Message sent successfully! We will get back to you soon.');app.state.contactForm={name:'',email:'',message:''};app.renderCurrentPage()" class="space-y-6 p-8 rounded-3xl bg-bg-card border border-white/[0.06]">
                        <div><label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2">Name</label><input required type="text" value="${this.state.contactForm.name}" oninput="app.state.contactForm.name=this.value" class="w-full px-4 py-3 rounded-xl bg-bg-elevated border border-white/10 text-white focus:border-accent/50 focus:outline-none" placeholder="Your name"/></div>
                        <div><label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2">Email</label><input required type="email" value="${this.state.contactForm.email}" oninput="app.state.contactForm.email=this.value" class="w-full px-4 py-3 rounded-xl bg-bg-elevated border border-white/10 text-white focus:border-accent/50 focus:outline-none" placeholder="you@example.com"/></div>
                        <div><label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-2">Message</label><textarea required rows="5" value="${this.state.contactForm.message}" oninput="app.state.contactForm.message=this.value" class="w-full px-4 py-3 rounded-xl bg-bg-elevated border border-white/10 text-white focus:border-accent/50 focus:outline-none resize-none" placeholder="How can we help?"></textarea></div>
                        <button type="submit" class="btn-glow w-full py-4 rounded-xl bg-accent hover:bg-accent-glow text-white font-bold text-lg transition-all cursor-pointer shadow-lg shadow-accent/20">Send Message</button>
                    </form>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4">
                        <a href="mailto:lucapetrone2013@icloud.com" class="block p-6 rounded-2xl bg-bg-card border border-white/[0.06] text-center hover:border-accent/30 transition-all group cursor-pointer">
                            <i data-lucide="mail" class="w-6 h-6 text-accent mx-auto mb-3 group-hover:scale-110 transition-transform"></i>
                            <h3 class="font-bold text-white mb-1">Email Us Directly</h3>
                            <p class="text-sm text-zinc-400 group-hover:text-accent-glow transition-colors">lucapetrone2013@icloud.com</p>
                        </a>
                        <div class="p-6 rounded-2xl bg-bg-card border border-white/[0.06] text-center">
                            <i data-lucide="clock" class="w-6 h-6 text-accent mx-auto mb-3"></i>
                            <h3 class="font-bold text-white mb-1">Response Time</h3>
                            <p class="text-sm text-zinc-400">Usually within 24-48 hours</p>
                        </div>
                    </div>
                </section>`},
            
            renderPrivacy(){
                return `<section class="max-w-3xl mx-auto py-14 sm:py-20 space-y-10">
                    <div class="space-y-4"><h1 class="text-4xl font-extrabold text-white tracking-tight">Privacy Policy</h1><p class="text-sm text-zinc-500">Last Updated: November 15, 2026</p></div>
                    <div class="prose prose-invert prose-zinc max-w-none space-y-8 text-zinc-400 leading-relaxed">
                        <div class="p-6 rounded-2xl bg-bg-card border border-white/[0.06]"><h2 class="text-xl font-bold text-white mb-3">1. No Data Collection</h2><p>PlayFinder is a 100% client-side application. We do not collect, store, transmit, or sell any personal information. There are no analytics trackers, no cookies for advertising, and no user accounts.</p></div>
                        <div class="p-6 rounded-2xl bg-bg-card border border-white/[0.06]"><h2 class="text-xl font-bold text-white mb-3">2. Local Storage</h2><p>Your favorites, recently viewed games, and quiz results are stored exclusively in your browser's LocalStorage. This data never leaves your device and is completely under your control. Clearing your browser cache will remove this data.</p></div>
                        <div class="p-6 rounded-2xl bg-bg-card border border-white/[0.06]"><h2 class="text-xl font-bold text-white mb-3">3. No Advertisements</h2><p>PlayFinder does not display advertisements. We believe in an uninterrupted, premium discovery experience. There are no sponsored placements, affiliate links, or third-party ad networks embedded in this application.</p></div>
                        <div class="p-6 rounded-2xl bg-bg-card border border-white/[0.06]"><h2 class="text-xl font-bold text-white mb-3">4. Contact Form</h2><p>If you use our contact form, the information you provide (name, email, message) is used solely to respond to your inquiry. We do not add you to any mailing list or share your details with third parties.</p></div>
                        <div class="p-6 rounded-2xl bg-bg-card border border-white/[0.06]"><h2 class="text-xl font-bold text-white mb-3">5. Changes to This Policy</h2><p>We may update this privacy policy from time to time. Any changes will be reflected on this page with an updated revision date. Continued use of PlayFinder constitutes acceptance of these terms.</p></div>
                    </div>
                    <div class="pt-8 border-t border-white/[0.06]"><button onclick="app.navigate('home')" class="btn-glow px-6 py-3 rounded-xl bg-accent hover:bg-accent-glow text-white font-bold text-sm cursor-pointer shadow-lg shadow-accent/20">Back to Home</button></div>
                </section>`}
        };
        document.addEventListener('DOMContentLoaded',()=>app.init());
    </script>
</body>
</html>
